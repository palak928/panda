{% extends "base.html" %}

{% block content %}
<style>
    .contact-page {
        padding: 4rem 2rem;
        max-width: 800px;
        margin: 0 auto;
    }

    .page-header {
        text-align: center;
        margin-bottom: 3rem;
    }

    .page-header h1 {
        font-size: 3rem;
        color: #ffffff;
        margin-bottom: 1rem;
    }

    .page-header p {
        color: rgba(255, 255, 255, 0.7);
        font-size: 1.2rem;
    }

    .contact-form {
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 15px;
        padding: 2rem;
        margin-bottom: 3rem;
    }

    .form-group {
        margin-bottom: 1.5rem;
    }

    .form-group label {
        display: block;
        color: #ffffff;
        margin-bottom: 0.5rem;
        font-weight: 500;
    }

    .form-group input,
    .form-group select,
    .form-group textarea {
        width: 100%;
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 8px;
        padding: 1rem;
        color: #ffffff;
        font-size: 1rem;
        transition: border-color 0.3s;
    }

    .form-group input:focus,
    .form-group select:focus,
    .form-group textarea:focus {
        outline: none;
        border-color: #00E5FF;
    }

    .form-group input::placeholder,
    .form-group textarea::placeholder {
        color: rgba(255, 255, 255, 0.5);
    }

    .btn-primary {
        background: linear-gradient(135deg, #00E5FF, #0088CC);
        color: #06080B;
        padding: 1rem 3rem;
        border: none;
        border-radius: 8px;
        font-size: 1.1rem;
        font-weight: bold;
        cursor: pointer;
        width: 100%;
        transition: transform 0.3s, box-shadow 0.3s;
    }

    .btn-primary:hover {
        transform: translateY(-3px);
        box-shadow: 0 10px 30px rgba(0, 229, 255, 0.4);
    }

    .contact-info {
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 15px;
        padding: 2rem;
    }

    .contact-info h3 {
        color: #00E5FF;
        margin-bottom: 1.5rem;
    }

    .contact-item {
        margin-bottom: 1.5rem;
    }

    .contact-item h4 {
        color: #ffffff;
        margin-bottom: 0.5rem;
    }

    .contact-item p {
        color: rgba(255, 255, 255, 0.7);
    }
</style>

<div class="contact-page">
    <div class="page-header">
        <h1>CONTACT US</h1>
        <p>Have a question? We're here to help.</p>
    </div>

    <div class="contact-form">
        <form>
            <div class="form-group">
                <label for="name">Name *</label>
                <input type="text" id="name" required placeholder="Your name">
            </div>
            <div class="form-group">
                <label for="email">Email *</label>
                <input type="email" id="email" required placeholder="your@email.com">
            </div>
            <div class="form-group">
                <label for="phone">Phone</label>
                <input type="tel" id="phone" placeholder="(416) 555-0123">
            </div>
            <div class="form-group">
                <label for="service">Service Interest</label>
                <select id="service">
                    <option value="">Select a service</option>
                    <option value="essential">Essential - The Refresh</option>
                    <option value="complete">Complete - The Transformation</option>
                    <option value="premium">Premium - The Showroom</option>
                </select>
            </div>
            <div class="form-group">
                <label for="message">Message *</label>
                <textarea id="message" rows="5" required placeholder="How can we help you?"></textarea>
            </div>
            <button type="submit" class="btn-primary">SEND MESSAGE</button>
        </form>
    </div>

    <div class="contact-info">
        <h3>CONTACT INFORMATION</h3>
        <div class="contact-item">
            <h4>Service Area</h4>
            <p>GTA, Metro Vancouver, Calgary, Edmonton, Ottawa-Gatineau, Montreal, Kitchener-Waterloo</p>
        </div>
        <div class="contact-item">
            <h4>Email</h4>
            <p>info@pandahub.ca</p>
        </div>
        <div class="contact-item">
            <h4>Phone</h4>
            <p>(416) 555-PANDA</p>
        </div>
    </div>
</div>
{% endblock %}
